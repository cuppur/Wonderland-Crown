<!doctype html>
<meta charset="utf-8">
<title>PROTOTYPE — 三门城墙布局</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Microsoft YaHei";background:#284b3b}body{display:grid;place-items:center}.stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;overflow:hidden;background:linear-gradient(#cceff2 0 20%,#a8d878 20%);border:6px solid #ffefb2}.hud{position:absolute;inset:2% 2% auto;height:8%;display:grid;grid-template-columns:1fr 18% 1fr;gap:1%;z-index:3}.hud>*{background:#fff3d4;border:2px solid #b6879c;border-radius:22px}.dock{position:absolute;bottom:1%;left:30%;width:45%;height:14%;border:3px solid #ae7da4;border-radius:22px;background:#fff4dc}.skills{position:absolute;left:1.5%;bottom:1.5%;width:27%;height:11%;display:flex;gap:6px}.skills>*{flex:1;border-radius:14px;background:#e8d7f6;border:2px solid #9d78a5}.road{position:absolute;left:7.5%;right:7.5%;height:8%;background:#f8e5b8;border-block:6px solid #6aa85b}.r1{top:31%}.r2{top:47%}.r3{top:63%}.base{position:absolute;top:24%;bottom:20%;width:8.5%;background:#f3dfbd;border:4px solid #9e7b70}.left{left:0}.right{right:0;transform:scaleX(-1)}.door{position:absolute;right:-3px;width:36px;height:12%;border-radius:18px 0 0 18px;background:#594137;border:4px solid #d0a35c}.door:after{content:"";position:absolute;left:100%;top:38%;width:28px;height:8px;background:#d8c18f}.d1{top:14%}.d2{top:44%}.d3{top:74%}.cannon{position:absolute;right:8%;top:-12%;width:58px;height:22px;border-radius:12px;background:#3e3d46;border:5px solid #367ead}.cannon:after{content:"";position:absolute;left:-12px;top:3px;width:20px;height:20px;border-radius:50%;background:#367ead;border:3px solid #f3bd55}.flag{position:absolute;left:12%;top:4%;color:#337cb5}.variant-b .base{width:9%;background:transparent;border:0}.variant-b .door{right:0;width:82px;height:20%;border-radius:30px 0 0 30px;background:#f3dfbd}.variant-b .d1{top:5%}.variant-b .d2{top:39%}.variant-b .d3{top:73%}.variant-b .cannon{right:20%;top:-5%}.variant-c .base{top:28%;bottom:24%;width:7%;border-radius:0 18px 18px 0}.variant-c .door{right:-22px;width:46px;height:14%;border-radius:50%;}.variant-c .cannon{right:-10%;top:-16%}.switch{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px;padding:7px 12px;border-radius:999px;background:#352f43;color:white;z-index:10}.switch button{border:0;border-radius:50%;width:28px;height:28px}.label{min-width:170px;text-align:center;line-height:28px}
</style>
<div id="stage" class="stage">
  <div class="hud"><i></i><i></i><i></i></div>
  <div class="road r1"></div><div class="road r2"></div><div class="road r3"></div>
  <div class="base left"><b class="flag">⚑</b><i class="cannon"></i><i class="door d1"></i><i class="door d2"></i><i class="door d3"></i></div>
  <div class="base right"><b class="flag">⚑</b><i class="cannon"></i><i class="door d1"></i><i class="door d2"></i><i class="door d3"></i></div>
  <div class="skills"><i></i><i></i></div><div class="dock"></div>
</div>
<div class="switch"><button id="prev">←</button><span id="label" class="label"></span><button id="next">→</button></div>
<script>
// PROTOTYPE — three castle/UI proportions on the existing 16:9 battle surface; delete after decision.
const variants=['A — 连续三门城墙','B — 三段门楼','C — 圆角侧墙'];let i=Math.max(0,variants.findIndex(x=>x[0]===(new URLSearchParams(location.search).get('variant')||'A')));const stage=document.querySelector('#stage'),label=document.querySelector('#label');function show(){stage.className='stage variant-'+variants[i][0].toLowerCase();label.textContent=variants[i];history.replaceState(null,'','?variant='+variants[i][0])}function move(d){i=(i+d+variants.length)%variants.length;show()}prev.onclick=()=>move(-1);next.onclick=()=>move(1);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});show();
</script>
