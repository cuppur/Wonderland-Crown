<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>奇境王冠 · 2.5D 糖果蛋糕城预览</title>
<style>
/* ============================================================
   奇境王冠 · 对局 UI 重构预览（展示页，不是正式游戏）
   - 战场：Canvas 程序绘制的俯视手绘风草地 / 道路 / 三门城墙 / 墙顶炮台
   - HUD：独立 DOM 组件，尺寸单位 rem = 舞台基准单位 u（由 JS 按舞台尺寸计算）
   - 比例：舞台可切换 16:9 / 19.5:9 / 4:3 / 自适应窗口，战场随比例拉伸
   ============================================================ */
:root{
  --ink:#5b4461;            /* 全局描边与文字：深紫棕，替代纯黑 */
  --ink-soft:rgba(91,68,97,.18);
  --cream:#fff8ea; --cream-2:#fbedd2; --line:#ead3ad;
  --gold:#f7c94f; --gold-d:#d99a2b;
  --blue:#5aa9f0; --blue-d:#2f72bd; --blue-l:#d8ecff;
  --red:#f27384;  --red-d:#c4485e;  --red-l:#ffe0e4;
  --ui-font:"Microsoft YaHei UI","PingFang SC","HarmonyOS Sans SC","Noto Sans SC",system-ui,sans-serif;
  --num-font:"Segoe UI","SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#2b2531;color:var(--ink);font-family:var(--ui-font);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- 预览工具栏（页面外壳，固定 px，不随舞台缩放） ---------- */
#toolbar{position:fixed;inset:0 0 auto 0;height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;color:#efe6f4;font-size:13px;z-index:10}
#toolbar .title{font-weight:700;font-size:14px;margin-right:6px;white-space:nowrap}
#toolbar .group{display:flex;gap:6px}
#toolbar button{padding:5px 12px;border-radius:999px;background:#443b4d;border:1px solid #5b5066;color:#efe6f4;font-size:12.5px;white-space:nowrap}
#toolbar button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#4b3550;font-weight:700}
#toolbar .size{margin-left:auto;font:12px/1 var(--num-font);opacity:.7;white-space:nowrap}
body.fill #toolbar{display:none}
#exitFill{display:none}
body.fill #exitFill{display:flex}
#viewport{position:fixed;inset:44px 0 0 0;display:grid;place-items:center}
body.fill #viewport{inset:0}

/* ---------- 舞台 ---------- */
#stage{position:relative;overflow:hidden;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);background:#93d16f;user-select:none;touch-action:none}
body.fill #stage{border-radius:0;box-shadow:none}
#field{position:absolute;inset:0;width:100%;height:100%;display:block}

/* 所有 HUD 尺寸使用 rem（= u）。最小字号用 max() 保底，保证手机可读。 */
.hud{position:absolute;pointer-events:none}
.hud > *{pointer-events:auto}
.panel{background:var(--cream);border:max(1.5px,.22rem) solid var(--line);box-shadow:0 .35rem 0 var(--ink-soft)}

/* ---------- 顶部细条：双方血条 + 倒计时 + 菜单 ---------- */
#topbar{left:1.2rem;right:1.2rem;top:.9rem;height:5.6rem;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;align-items:center;gap:1.2rem}
.plate{height:5rem;border-radius:2.5rem;display:flex;align-items:center;gap:1rem;padding:0 1.6rem 0 .5rem;min-width:0}
.plate.enemy{flex-direction:row-reverse;padding:0 .5rem 0 1.6rem}
.crest{flex:none;width:4rem;height:4rem;border-radius:50%;display:grid;place-items:center;font-size:2.1rem;color:#fff;background:var(--blue);border:.25rem solid #fff;box-shadow:0 0 0 max(1px,.16rem) var(--blue-d)}
.enemy .crest{background:var(--red);box-shadow:0 0 0 max(1px,.16rem) var(--red-d)}
.plate .info{flex:1;min-width:0}
.plate .row{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem;font-size:max(10px,1.55rem);font-weight:800;line-height:1.15;white-space:nowrap}
.enemy .row{flex-direction:row-reverse}
.plate .hp{font:700 max(9px,1.35rem)/1 var(--num-font);font-variant-numeric:tabular-nums;opacity:.75}
.bar{height:1.35rem;margin-top:.4rem;border-radius:1rem;background:#eee2d0;overflow:hidden;box-shadow:inset 0 .15rem 0 rgba(91,68,97,.14)}
.bar i{display:block;height:100%;width:100%;border-radius:inherit;background:linear-gradient(#86caff,#4f9de9);transition:width .25s}
.enemy .bar{transform:scaleX(-1)}
.enemy .bar i{background:linear-gradient(#ffa2ae,#ee6779)}
.timer{min-width:13rem;height:5.6rem;padding:0 2.2rem;border-radius:2.8rem;display:grid;place-content:center;text-align:center;background:linear-gradient(#fff4cc,#ffe08c);border:max(1.5px,.24rem) solid #efc25b;box-shadow:0 .35rem 0 rgba(170,115,30,.22)}
.timer b{font:800 max(15px,2.8rem)/1 var(--num-font);font-variant-numeric:tabular-nums;color:#7b4a2a;letter-spacing:.05em}
.timer small{display:block;margin-top:.25rem;font-size:max(9px,1.1rem);font-weight:700;color:#a87445}
.round-btn{width:5rem;height:5rem;border-radius:50%;display:grid;place-items:center;font-size:2.2rem;background:var(--cream);border:max(1.5px,.22rem) solid var(--line);box-shadow:0 .35rem 0 var(--ink-soft)}
.round-btn:active{transform:translateY(.25rem);box-shadow:0 .1rem 0 var(--ink-soft)}
.burger{display:grid;gap:.42rem}
.burger i{display:block;width:2.1rem;height:.36rem;border-radius:.2rem;background:var(--ink)}
#menuPop{position:absolute;right:1.2rem;top:7.6rem;padding:.8rem;border-radius:1.8rem;display:none;flex-direction:column;gap:.3rem;min-width:17rem;z-index:3}
#menuPop.open{display:flex}
#menuPop button{display:flex;align-items:center;gap:1rem;padding:.9rem 1.2rem;border-radius:1.2rem;font-size:max(11px,1.6rem);font-weight:700;text-align:left}
#menuPop button:hover{background:var(--cream-2)}
#menuPop .ico{font-family:var(--emoji);font-size:max(12px,1.8rem);width:2.4rem;text-align:center}

/* ---------- 战场提示 ---------- */
#hint{left:50%;top:8.4rem;transform:translateX(-50%);padding:.7rem 1.8rem;border-radius:2rem;background:rgba(91,68,97,.82);color:#fff;font-size:max(10px,1.45rem);font-weight:700;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
#hint.show{opacity:1}

/* ---------- 底部：左侧技能 + 中间卡牌托盘（外观还原原版） ---------- */
#dock{left:1.2rem;right:1.2rem;bottom:.9rem;height:12.6rem}
#skills{position:absolute;left:0;bottom:0;display:flex;gap:.8rem}
#hand{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:100%;display:flex;align-items:stretch;gap:.62rem;padding:.62rem .8rem;border-radius:1.7rem;background:#f3dce8;border:max(2px,.25rem) solid #a06d9d;box-shadow:inset 0 .19rem 0 #fff,0 0 0 max(1.5px,.19rem) #ffe8a1,0 .38rem 0 #7a567d,0 .75rem 1.2rem rgba(56,40,61,.4)}
#hand::before,#hand::after{position:absolute;top:-.82rem;font-family:var(--emoji);font-size:max(12px,1.2rem);line-height:1;z-index:4}
#hand::before{content:"🌸";left:1.1rem}
#hand::after{content:"🌼";right:1.1rem}

.coins{width:7.4rem;border-radius:1.05rem;padding:.5rem;display:flex;flex-direction:column;justify-content:center;gap:.32rem;background:#f2cf83;border:max(1.5px,.19rem) solid #d49b56;box-shadow:inset 0 .13rem 0 #fff,0 .19rem 0 #a8683e;color:#65403f}
.coins b{font-size:max(12px,1.25rem);font-weight:900;color:#593013;text-shadow:0 1px #fff4bd;white-space:nowrap;font-variant-numeric:tabular-nums}
.coins .bar{height:.6rem;margin:0;border:max(1px,.13rem) solid #6c351c;background:#5b2f1c;box-shadow:none}
.coins .bar i{background:linear-gradient(90deg,#f0a918,#fff08d);box-shadow:inset 0 1px #fff7bd}
.coins small{font-size:max(8px,.7rem);font-weight:800;opacity:.72;white-space:nowrap}

.card{position:relative;width:8.5rem;border-radius:1.25rem;padding:0 .38rem;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#492919;background:var(--card-bg);border:max(1.5px,.19rem) solid #fff6d4;box-shadow:inset 0 .13rem 0 #fff,0 0 0 max(1.5px,.19rem) #8c6a9c,0 .32rem 0 #705179,0 .56rem .8rem rgba(0,0,0,.27);transition:transform .15s,filter .2s}
.card::before{content:"";position:absolute;inset:.19rem;border:1px solid rgba(255,255,255,.48);border-radius:.56rem;pointer-events:none}
.card .art{width:100%;height:4.6rem;margin-top:.9rem;display:grid;place-items:center;font-family:var(--emoji);font-size:2.9rem;line-height:1;background:radial-gradient(ellipse at 50% 95%,rgba(255,255,255,.68),transparent 63%)}
.card .name{font-size:max(10px,.9rem);font-weight:900;text-shadow:0 1px #fff9d0;white-space:nowrap;margin-top:.15rem}
.card .tag{font-size:max(8px,.58rem);font-weight:800;opacity:.72;white-space:nowrap}
.cost{position:absolute;right:.32rem;top:.32rem;width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;font:900 max(10px,1rem)/1 var(--num-font);color:#2a1903;background:radial-gradient(circle at 35% 30%,#fff9b8,#e9a92c 55%,#86510e 57%);border:max(1.5px,.13rem) solid #fff6b5;box-shadow:0 .13rem 0 #6f3d0e,0 .25rem .45rem rgba(0,0,0,.4);z-index:2}
.card[data-type="snake"]{--card-bg:linear-gradient(160deg,#efffd8,#abe88f 56%,#72bf85)}
.card[data-type="lion"]{--card-bg:linear-gradient(160deg,#fff4cf,#ffd078 58%,#ed9563)}
.card[data-type="elephant"]{--card-bg:linear-gradient(160deg,#eafdff,#9fdef0 58%,#75aede)}
.card[data-type="dragon"]{--card-bg:linear-gradient(160deg,#fcecff,#d9a8ef 58%,#a77fcb)}

.skill{position:relative;width:8rem;height:9.8rem;border-radius:1.15rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;overflow:hidden;color:#613b65;border:max(1.5px,.19rem) solid #fff1c8;box-shadow:inset 0 .13rem 0 #fff,0 0 0 max(1.5px,.19rem) #7f5b98,0 .32rem 0 #654777,0 .56rem .9rem rgba(0,0,0,.27);transition:transform .15s,filter .2s}
.skill.potion{background:#d7b7e8}
.skill.burst{background:#f3b184}
.skill .art{height:4rem;display:grid;place-items:center;font-family:var(--emoji);font-size:3.1rem;line-height:1}
.skill .art svg{width:5.4rem;height:4rem}
.skill .name{font-size:max(10px,.95rem);font-weight:800;white-space:nowrap}
.skill .meta{font:700 max(8px,.7rem)/1 var(--num-font)}
.skill .count{padding:.15rem .5rem;border-radius:1rem;background:rgba(255,255,255,.55)}
.skill .cost{width:1.9rem;height:1.9rem;font-size:max(9px,.85rem)}

.card:hover,.skill:hover{transform:translateY(-.32rem);filter:brightness(1.05)}
.card.selected,.skill.selected{transform:translateY(-.2rem);filter:brightness(1.16);outline:max(2px,.19rem) solid #fff7bf;box-shadow:0 0 0 max(1.5px,.19rem) #9c551f,0 0 1.15rem #ffe787}
.card.poor,.card.cooling,.skill.poor,.skill.cooling{filter:grayscale(.72) brightness(.68)}
.card.buffed{outline:max(2px,.19rem) solid #d798ff;box-shadow:0 0 1.6rem rgba(199,120,255,.9),0 .56rem 1.25rem rgba(0,0,0,.42)}
.card.buffed::after{content:"药水强化";position:absolute;left:.32rem;bottom:.32rem;padding:.12rem .32rem;border-radius:.38rem;background:rgba(101,39,145,.9);border:1px solid #e2b3ff;color:#fff;font-size:max(8px,.56rem);font-weight:900;z-index:3}

/* 冷却遮罩：原版样式，从底部按剩余比例升起 + 秒数 */
.cd{display:none;position:absolute;left:0;right:0;bottom:0;height:calc(var(--p,0) * 100%);background:linear-gradient(rgba(31,23,25,.64),rgba(12,9,13,.86));z-index:1;pointer-events:none}
.cooling .cd{display:block}
.cooling::after{content:attr(data-cd);position:absolute;inset:0;display:grid;place-items:center;font:900 max(12px,1.5rem)/1 var(--num-font);color:#fff7cf;text-shadow:0 2px 5px #000;z-index:4;pointer-events:none}

/* 2.5D 版：技能、金币、四张卡同在一条长托盘里 */
#hand{gap:.55rem}
#hand .skill{height:auto;width:7.4rem}
#hand .skill.burst{margin-right:.45rem}
#hand .coins{margin-right:.2rem}

/* ---------- 竖屏提示（仅自适应模式） ---------- */
#rotate{position:absolute;inset:0;display:none;place-content:center;text-align:center;gap:12px;background:#2b2531;color:#fff;font-size:16px;z-index:5}
#rotate .ico{font-size:44px;font-family:var(--emoji)}
#stage.portrait #rotate{display:grid}
</style>
</head>
<body>
<div id="toolbar">
  <span class="title">奇境王冠 · 2.5D 糖果蛋糕城（快速视觉验收）</span>
  <div class="group" id="ratioGroup">
    <button data-ratio="1.7778" aria-pressed="true">电脑 16:9</button>
  </div>
  <div class="group">
    <button id="autoBtn" aria-pressed="true">自动演示</button>
    <button id="restartBtn">重新开始</button>
  </div>
  <span class="size" id="sizeLabel"></span>
</div>

<div id="viewport">
  <div id="stage">
    <canvas id="field" aria-label="交汇战线战场"></canvas>

    <div id="topbar" class="hud">
      <div class="plate player panel">
        <div class="crest">♛</div>
        <div class="info">
          <div class="row"><span>曙光王庭</span><span class="hp" id="pHpText">10000</span></div>
          <div class="bar"><i id="pHp"></i></div>
        </div>
      </div>
      <div class="timer"><b id="timer">05:00</b><small>交汇战线</small></div>
      <div class="plate enemy panel">
        <div class="crest">♜</div>
        <div class="info">
          <div class="row"><span>暮影王庭</span><span class="hp" id="eHpText">10000</span></div>
          <div class="bar"><i id="eHp"></i></div>
        </div>
      </div>
      <button class="round-btn" id="menuBtn" title="菜单" aria-label="菜单" aria-expanded="false"><span class="burger"><i></i><i></i><i></i></span></button>
    </div>
    <div id="menuPop" class="panel" role="menu">
      <button role="menuitem" id="pauseItem"><span class="ico">⏸️</span><span>暂停对局</span></button>
      <button role="menuitem"><span class="ico">🔊</span><span>音乐与音效</span></button>
      <button role="menuitem"><span class="ico">📊</span><span>数值报告</span></button>
      <button role="menuitem"><span class="ico">⛶</span><span>全屏</span></button>
      <button role="menuitem"><span class="ico">🏠</span><span>返回首页</span></button>
      <button role="menuitem" id="exitFill"><span class="ico">↩️</span><span>退出自适应预览</span></button>
    </div>

    <div id="hint" class="hud" aria-live="polite"></div>

    <div id="dock" class="hud">
      <div id="hand">
        <button class="skill potion" data-skill="potion" title="魔力药水：选中后点一张卡牌，强化该卡下一次部署的单位">
          <span class="cost">5</span>
          <span class="art">🧪</span><span class="name">魔力药水</span>
          <span class="meta"><span class="count">强化</span></span>
          <span class="cd"></span>
        </button>
        <button class="skill burst" data-skill="burst" title="爆裂炮阵：选中后点一条道路，沿该路连续炮击">
          <span class="cost">20</span>
          <span class="art"><svg viewBox="0 0 70 52" aria-hidden="true">
            <ellipse cx="35" cy="47" rx="24" ry="3.5" fill="rgba(91,68,97,.18)"/>
            <rect x="20" y="15" width="40" height="15" rx="7.5" fill="#5f6577" transform="rotate(-14 40 22)"/>
            <rect x="53" y="10" width="8" height="19" rx="3" fill="#4a4f5f" transform="rotate(-14 57 19)"/>
            <circle cx="24" cy="36" r="10" fill="#c98a4b" stroke="#8b5a32" stroke-width="2.5"/>
            <circle cx="24" cy="36" r="3" fill="#f7c94f"/>
            <rect x="8" y="38" width="30" height="7" rx="3.5" fill="#a46a3c"/>
          </svg></span>
          <span class="name">爆裂炮阵</span>
          <span class="meta"><span class="count">×10</span></span>
          <span class="cd"></span>
        </button>
        <div class="coins">
          <b id="coinText">🟡 15.0</b>
          <div class="bar"><i id="coinBar"></i></div>
          <small>金币增长：1 / 秒</small>
        </div>
        <button class="card" data-type="snake" title="毒影蛇 · 快速刺客&#10;生命 500 · 攻击 10 · 移速 80 · 射程 60&#10;中毒 2/s×10 秒，可独立叠加"><span class="cost">10</span><span class="art">🐍</span><span class="name">毒影蛇</span><span class="tag">快速刺客</span><span class="cd"></span></button>
        <button class="card" data-type="lion" title="圣鬃狮 · 均衡战士&#10;生命 700 · 攻击 20 · 移速 60 · 射程 70&#10;参与击杀回复 100 生命"><span class="cost">10</span><span class="art">🦁</span><span class="name">圣鬃狮</span><span class="tag">均衡战士</span><span class="cd"></span></button>
        <button class="card" data-type="elephant" title="磐石象 · 慢速坦克&#10;生命 1000 · 攻击 15 · 移速 40 · 射程 80&#10;每 3 秒蓄势，下一击 300% 伤害"><span class="cost">10</span><span class="art">🐘</span><span class="name">磐石象</span><span class="tag">慢速坦克</span><span class="cd"></span></button>
        <button class="card" data-type="dragon" title="星焰龙 · 远程魔法&#10;生命 800 · 攻击 20 · 移速 50 · 射程 100&#10;群体燃烧 20/s×3 秒"><span class="cost">10</span><span class="art">🐉</span><span class="name">星焰龙</span><span class="tag">远程魔法</span><span class="cd"></span></button>
      </div>
    </div>

    <div id="rotate"><div class="ico">📱↻</div><div>请将设备旋转至横屏</div></div>
  </div>
</div>

<script>
/* P1：舞台尺寸、比例切换、u 基准单位。战场绘制（P2）与演示逻辑（P3）见后续脚本块。 */
(() => {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const stage = $('#stage');
let ratio = 1.7778;

// u = 舞台基准单位（px）。按高度 1%，宽度过窄时收缩，太小时保底以保证手机可读。
function computeUnit(w, h) { return Math.max(6.5, Math.min(h / 65, w * .0097)); }

function fitStage() {
  const vp = $('#viewport').getBoundingClientRect();
  let w, h;
  if (ratio === 'fill') { w = vp.width; h = vp.height; }
  else {
    const pad = 24, aw = vp.width - pad, ah = vp.height - pad;
    if (aw / ah > ratio) { h = ah; w = h * ratio; } else { w = aw; h = w / ratio; }
  }
  w = Math.floor(w); h = Math.floor(h);
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  document.documentElement.style.fontSize = computeUnit(w, h).toFixed(2) + 'px';
  stage.classList.toggle('portrait', ratio === 'fill' && w / h < 1.15);
  $('#sizeLabel').textContent = `${w}×${h} · ${(w / h).toFixed(2)}:1`;
  window.dispatchEvent(new CustomEvent('stage-resize', { detail: { w, h } }));
}

$$('#ratioGroup button').forEach(b => b.addEventListener('click', () => {
  $$('#ratioGroup button').forEach(x => x.setAttribute('aria-pressed', x === b));
  ratio = b.dataset.ratio === 'fill' ? 'fill' : +b.dataset.ratio;
  document.body.classList.toggle('fill', ratio === 'fill');
  fitStage();
}));
const menuBtn = $('#menuBtn'), menuPop = $('#menuPop');
menuBtn.addEventListener('click', e => { e.stopPropagation(); const open = !menuPop.classList.contains('open'); menuPop.classList.toggle('open', open); menuBtn.setAttribute('aria-expanded', open); });
document.addEventListener('click', e => { if (!menuPop.contains(e.target)) { menuPop.classList.remove('open'); menuBtn.setAttribute('aria-expanded', false); } });
$('#exitFill').addEventListener('click', () => $('#ratioGroup button').click());
window.addEventListener('resize', fitStage);
window.QJ = { $, $$, stage, fitStage };
})();
</script>
<script>
/* P2：战场。全部程序绘制：手绘风草地、参数化交汇道路、三门城墙、墙顶炮台。 */
(() => {
'use strict';
const canvas = QJ.$('#field'), ctx = canvas.getContext('2d');
const TAU = Math.PI * 2, lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const INK = 'rgba(91,68,97,.72)';
const TEAM = {

/* ---------- 几何：全部由舞台宽高推导，战场随比例拉伸 ---------- */

  const S0 = rw / 50;                               // 线宽/细节基准
  const T = rw * 1.2;                               // 城墙厚度
  const m = Math.max(w * .016, rw * .25);           // 城墙到舞台边缘
  const x1L = m + T, x1R = w - m - T;               // 城墙内侧面
  const rs = x1L + rw * .62, re = x1R - rw * .62;   // 出生平台中心 = 路径起点
  const L = re - rs, cx = w / 2, ys = [cy - s, cy, cy + s];
  const lead = L * .1, hx = L * .15, slope = 1.45 * s / (L / 2 - lead);
  const cross = (y0, y1) => {
    const dir = Math.sign(y1 - y0), pts = [{ x: rs, y: y0 }, { x: rs + lead, y: y0 }];
    bez(pts, { x: rs + lead, y: y0 }, { x: rs + lead + L * .14, y: y0 }, { x: cx - hx, y: cy - dir * hx * slope }, { x: cx, y: cy }, 28);

    w, h, u, top, bottom, cy, cx, s, rw, road, S0, T, m, x1L, x1R, rs, re, L, ys, paths,
    wy0: ys[0] - rw * 1.05, wy1: ys[2] + rw * 1.05,
    unitR: rw * .3,
    k: L / 1070,                                    // 原版道路长 1070 px → 当前像素的换算系数
    pivot: { player: { x: m + T * .7, y: ys[1] + road * .25 - T * (.82 * .38 * .8 + 1.3) }, enemy: { x: w - m - T * .7, y: ys[1] + road * .25 - T * (.82 * .38 * .8 + 1.3) } }
  };
}

    }
  }
  S.units = S.units.filter(u => !u.dead);
}
function updateGuns(dt) {
  const f = F();
  for (const side of ['player', 'enemy']) {
    const g = S.gun[side], piv = f.pivot[side], range = f.L * .3;
    g.clock = Math.max(0, g.clock - dt); g.recoil = Math.max(0, g.recoil - dt * 5);
    // 目标：射程内最靠近己方城门的敌军
    let target = null, best = Infinity;
    for (const u of S.units) {
      if (u.side === side) continue;
      const p = unitPos(u), dd = Math.hypot(p.x - piv.x, p.y - piv.y);
      if (dd < range && dd < best) { best = dd; target = u; }
    }
    g.target = target;
    const aim = target ? (() => { const p = unitPos(target); return Math.atan2(p.y - piv.y, p.x - piv.x); })() : g.rest;
    g.angle += Math.atan2(Math.sin(aim - g.angle), Math.cos(aim - g.angle)) * clamp(dt * 7, 0, 1);
    if (g.windup > 0) {
      g.windup -= dt;
      if (g.windup <= 0) {
        if (target) {
          const m = fd.muzzle(f, side, g.angle), tp = unitPos(target), dist = Math.hypot(tp.x - m.x, tp.y - m.y);
          S.shots.push({ kind: 'shell', side, sx: m.x, sy: m.y, tx: tp.x, ty: tp.y, t: 0, dur: Math.max(.22, dist / (CANNON.speed * f.k)), target, dmg: CANNON.dmg });
          S.fx.push({ kind: 'flash', x: m.x, y: m.y, a: g.angle, life: .16, max: .16 });
          g.recoil = 1;
        }
        g.clock = CANNON.interval;
      }
    } else if (target && g.clock <= 0) g.windup = CANNON.windup;
  }
}
function updateShots(dt) {
  const f = F();
  for (const s of S.shots) {
    if (s.kind === 'shell') {
      s.t += dt / s.dur;
      if (s.target && !s.target.dead) { const p = unitPos(s.target); s.tx = lerp(s.tx, p.x, .25); s.ty = lerp(s.ty, p.y, .25); }
      if (s.t >= 1) {
        s.done = true; S.fx.push({ kind: 'boom', x: s.tx, y: s.ty, r: f.rw * .55, life: .38, max: .38 });
        for (const u of S.units) { if (u.side === s.side) continue; const p = unitPos(u); if (Math.hypot(p.x - s.tx, p.y - s.ty) < f.rw * .55) damage(u, s.dmg); }
      }
    } else {
      if (!s.target || s.target.dead) { s.done = true; continue; }
      const p = unitPos(s.target), dx = p.x - s.x, dy = p.y - s.y, dd = Math.hypot(dx, dy), step = s.speed * dt;
      if (dd <= step) { s.done = true; damage(s.target, s.dmg); S.fx.push({ kind: 'spark', x: p.x, y: p.y, life: .3, max: .3 }); }
      else { s.x += dx / dd * step; s.y += dy / dd * step; }
    }
  }
  S.shots = S.shots.filter(s => !s.done);
}
function updateFx(dt) {
  const f = F();
  for (const x of S.fx) {
    if (x.delay > 0) { x.delay -= dt; continue; }
    x.life -= dt;
    if (x.kind === 'drop' && x.life <= 0 && !x.hit) {
      x.hit = true; const q = f.paths[x.lane].at(x.t);
      S.fx.push({ kind: 'boom', x: q.x, y: q.y, r: f.rw * .75, life: .48, max: .48, big: true });
      for (const u of S.units) { if (u.side === x.side) continue; const p = unitPos(u); if (Math.hypot(p.x - q.x, p.y - q.y) < f.rw * .8) damage(u, SKILLS.burst.dmg); }
    }
  }
  S.fx = S.fx.filter(x => x.delay > 0 || x.life > 0);
}
function update(dt) {
  if (S.paused) return;
  if (S.over > 0) { S.over -= dt; if (S.over <= 0) reset(); return; }
  S.clock += dt; S.time = Math.max(0, S.time - dt);
  for (const side of ['player', 'enemy']) {
    S.coins[side] += INCOME * dt;
    for (const k in S.cool[side]) S.cool[side][k] = Math.max(0, S.cool[side][k] - dt);
    for (const k in S.skillCool[side]) S.skillCool[side][k] = Math.max(0, S.skillCool[side][k] - dt);
    S.wall[side].shake = Math.max(0, S.wall[side].shake - dt * 3); S.wall[side].flash = Math.max(0, S.wall[side].flash - dt);
  }
  think('enemy', dt);
  if ($('#autoBtn').getAttribute('aria-pressed') === 'true') think('player', dt);
  updateUnits(dt); updateGuns(dt); updateShots(dt); updateFx(dt);
  if (S.hp.player <= 0 || S.hp.enemy <= 0 || S.time <= 0) {
    const win = S.hp.enemy < S.hp.player;
    hint(S.hp.enemy === S.hp.player ? '平局！3 秒后重新开始' : win ? '胜利！3 秒后重新开始' : '失败！3 秒后重新开始', 3); S.over = 3;
  }
}

/* ---------- 绘制 ---------- */
function drawUnit(u) {
  const d = UNITS[u.type], p = unitPos(u), r = unitR(u), team = fd.TEAM[u.side];
  const pop = u.born > 0 ? 1 - u.born / .35 : 1, s = .4 + .6 * pop, hop = Math.abs(Math.sin(u.bob)) * r * .2, lift = (r * 1.05 + hop) * s;
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.fillStyle = 'rgba(52,80,44,.3)'; ctx.beginPath(); ctx.ellipse(r * .1, r * .14, r * 1.15 * s, r * .5 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = team.dark; ctx.beginPath(); ctx.ellipse(0, r * .1, r * s, r * .42 * s, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = u.side === 'player' ? '#dceeff' : '#ffe2e7'; ctx.beginPath(); ctx.ellipse(0, 0, r * s, r * .42 * s, 0, 0, TAU); ctx.fill();
  ctx.lineWidth = Math.max(1.4, r * .12); ctx.strokeStyle = team.main; ctx.stroke();
  if (u.buffed) { ctx.strokeStyle = 'rgba(199,155,255,.9)'; ctx.lineWidth = Math.max(1.2, r * .09); ctx.beginPath(); ctx.ellipse(0, 0, r * 1.2 * s, r * .52 * s, 0, 0, TAU); ctx.stroke(); }
  ctx.save(); ctx.translate(0, -lift); const sc = s * (1 + u.attack * .12); ctx.scale(sc, sc);
  if (d.faceLeft === (u.side === 'player')) ctx.scale(-1, 1);
  ctx.globalAlpha = u.flash > 0 ? .6 : 1; ctx.shadowColor = 'rgba(255,255,255,.95)'; ctx.shadowBlur = r * .3;
  ctx.font = `${Math.round(r * 1.9)}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(d.icon, 0, 0);
  ctx.restore();
  if (u.buffed) { ctx.font = `${Math.round(r * .8)}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('👑', 0, -lift - r * 1.25); }
  ctx.restore();
  if (u.hp < u.maxHp) {
    const bw = r * 1.7, bh = Math.max(3, r * .17), x = p.x - bw / 2, y = p.y - lift - r * (u.buffed ? 1.75 : 1.2);
    ctx.fillStyle = 'rgba(255,255,255,.92)'; fd.rr(ctx, x - 1, y - 1, bw + 2, bh + 2, bh); ctx.fill();
    ctx.fillStyle = u.side === 'player' ? '#4f9de9' : '#ee6779'; fd.rr(ctx, x, y, bw * clamp(u.hp / u.maxHp, 0, 1), bh, bh); ctx.fill();
  }
}
function drawShot(s) {
  const f = F();
  if (s.kind === 'shell') {
    const x = lerp(s.sx, s.tx, s.t), y = lerp(s.sy, s.ty, s.t), lift = Math.sin(s.t * Math.PI) * f.rw * .7, r = f.rw * .1;
    ctx.fillStyle = 'rgba(52,80,44,.25)'; ctx.beginPath(); ctx.ellipse(x, y, r * 1.1, r * .45, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = r * .9; ctx.lineCap = 'round';
    const pt = Math.max(0, s.t - .08), px = lerp(s.sx, s.tx, pt), py = lerp(s.sy, s.ty, pt) - Math.sin(pt * Math.PI) * f.rw * .7;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y - lift); ctx.stroke();
    ctx.fillStyle = '#4b5060'; ctx.beginPath(); ctx.arc(x, y - lift, r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(x - r * .35, y - lift - r * .35, r * .35, 0, TAU); ctx.fill();
  } else {
    const r = f.unitR * .28, g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 1.8);
    g.addColorStop(0, '#fff6c8'); g.addColorStop(.45, s.side === 'player' ? '#a98bff' : '#ff9a6b'); g.addColorStop(1, 'rgba(255,160,120,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, r * 1.8, 0, TAU); ctx.fill();
  }
}
function star(x, y, r, n = 5) { ctx.beginPath(); for (let i = 0; i < n * 2; i++) { const a = i * Math.PI / n - Math.PI / 2, rr = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); }
function drawFx(x) {
  const f = F();
  if (x.delay > 0) return;
  const q = 1 - x.life / x.max;
  if (x.kind === 'drop') {
    const p = f.paths[x.lane].at(x.t), r = f.rw * (.25 + q * .45);
    ctx.fillStyle = `rgba(242,115,80,${.12 + q * .25})`; ctx.beginPath(); ctx.ellipse(p.x, p.y, r, r * .55, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(242,115,80,${.4 + q * .4})`; ctx.lineWidth = Math.max(1, 2 * f.S0); ctx.setLineDash([4 * f.S0, 3 * f.S0]); ctx.stroke(); ctx.setLineDash([]);
    const h = (1 - q) * f.rw * 3, sr = f.rw * .14;
    ctx.fillStyle = '#4b5060'; ctx.beginPath(); ctx.arc(p.x, p.y - h, sr, 0, TAU); ctx.fill();
  } else if (x.kind === 'boom') {
    const r = x.r * (.45 + q * .75), a = 1 - q;
    ctx.fillStyle = `rgba(255,240,170,${a * .85})`; ctx.beginPath(); ctx.arc(x.x, x.y, r * .7, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(255,170,90,${a})`; ctx.lineWidth = Math.max(1.5, x.r * .12 * a); ctx.beginPath(); ctx.arc(x.x, x.y, r, 0, TAU); ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${a * .9})`;
    for (let i = 0; i < 6; i++) { const ang = i * TAU / 6 + x.x, d = r * (.6 + q * .5); ctx.beginPath(); ctx.arc(x.x + Math.cos(ang) * d, x.y + Math.sin(ang) * d * .7, x.r * .16 * a + 1, 0, TAU); ctx.fill(); }
  } else if (x.kind === 'flash') {
    const r = f.rw * .22 * (1 - q * .5);
    ctx.fillStyle = `rgba(255,232,140,${1 - q})`; star(x.x + Math.cos(x.a) * r * .6, x.y + Math.sin(x.a) * r * .6, r, 6); ctx.fill();
  } else if (x.kind === 'clash' || x.kind === 'spark') {
    const r = f.unitR * (.35 + q * .35);
    ctx.fillStyle = x.kind === 'clash' ? `rgba(255,248,200,${1 - q})` : `rgba(255,214,140,${1 - q})`;
    star(x.x, x.y, r); ctx.fill();
  } else if (x.kind === 'poof') {
    ctx.fillStyle = `rgba(255,255,255,${(1 - q) * .85})`;
    for (let i = 0; i < 5; i++) { const ang = i * TAU / 5, d = f.unitR * (.3 + q * .9); ctx.beginPath(); ctx.arc(x.x + Math.cos(ang) * d, x.y + Math.sin(ang) * d, f.unitR * .35 * (1 - q * .5), 0, TAU); ctx.fill(); }
  }
}
function render() {
  const f = F(); if (!f) return;
  ctx.clearRect(0, 0, f.w, f.h);
  ctx.drawImage(fd.bg, 0, 0, f.w, f.h);
  if (S.hover >= 0 && S.selected) fd.highlightLane(ctx, f, S.hover, S.selected.id === 'burst' ? '#f27350' : '#5aa9f0');
  for (const side of ['player', 'enemy']) fd.drawWall(ctx, f, side, { hp: S.hp[side] / WALL_HP, shake: S.wall[side].shake, flash: S.wall[side].flash, time: S.clock });
  for (const side of ['player', 'enemy']) { const g = S.gun[side]; fd.drawCannon(ctx, f, side, { angle: g.angle, recoil: g.recoil, glow: g.windup > 0 ? 1 - g.windup / CANNON.windup : 0 }); }
  for (const x of S.fx) if (x.kind === 'drop') drawFx(x);
  const arr = [...S.units].sort((a, b) => unitPos(a).y - unitPos(b).y);
  for (const u of arr) drawUnit(u);
  for (const s of S.shots) drawShot(s);
  for (const x of S.fx) if (x.kind !== 'drop') drawFx(x);
}

/* ---------- HUD 同步 ---------- */
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function syncHud() {
  $('#pHp').style.width = (S.hp.player / WALL_HP * 100).toFixed(1) + '%';
  $('#eHp').style.width = (S.hp.enemy / WALL_HP * 100).toFixed(1) + '%';
  $('#pHpText').textContent = Math.ceil(S.hp.player); $('#eHpText').textContent = Math.ceil(S.hp.enemy);
  $('#timer').textContent = fmt(Math.ceil(S.time));
  $('#coinText').textContent = '🟡 ' + S.coins.player.toFixed(1);
  $('#coinBar').style.width = Math.min(100, S.coins.player / 20 * 100).toFixed(1) + '%';
  $$('.card').forEach(el => {
    const t = el.dataset.type, d = UNITS[t], c = S.cool.player[t] || 0;
    el.classList.toggle('poor', S.coins.player < d.cost); el.classList.toggle('cooling', c > 0); el.classList.toggle('buffed', S.buffed.player === t);
    el.style.setProperty('--p', (c / d.cd).toFixed(3)); el.dataset.cd = c > 0 ? c.toFixed(1) : '';
  });
  $$('.skill').forEach(el => {
    const id = el.dataset.skill, sk = SKILLS[id], c = S.skillCool.player[id];
    el.classList.toggle('poor', S.coins.player < sk.cost); el.classList.toggle('cooling', c > 0);
    el.style.setProperty('--p', (c / sk.cd).toFixed(3)); el.dataset.cd = c > 0 ? c.toFixed(1) : '';
  });
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (hintTimer > 0) { hintTimer -= dt; if (hintTimer <= 0) $('#hint').classList.remove('show'); }
  if (F()) { update(dt); render(); syncHud(); }
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
// 测试钩子：截图脚本用来快进
window.__QJ_DEMO__ = { get state() { return S; }, step(sec) { for (let i = 0; i < sec * 30; i++) update(1 / 30); render(); syncHud(); }, deploy, useBurst };
})();
</script>
